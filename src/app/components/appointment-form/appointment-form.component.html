<form [formGroup]="appointmentForm" (ngSubmit)="onSubmit()">
  <div class="row">
    <label for="appointmentDate" class="col-md-4">Appointment Date:</label>
    <input id="appointmentDate" class="col-md-4" formControlName="appointmentDate" type="date">
  </div>
  <div class="row">
    <label for="appointmentHour" class="col-md-4">Appointment Hour:</label>
    <input id="appointmentHour" class="col-md-4" formControlName="appointmentHour" type="time">
  </div>
  <div class="row">
    <label for="userName" class="col-md-4">Your Name:</label>
    <input id="userName" class="col-md-4" formControlName="userName" type="text">
  </div>
  <div class="row">
    <label for="mobileNo" class="col-md-4">Mobile No:</label>
    <input id="mobileNo" class="col-md-4" formControlName="mobileNo" type="text">
  </div>
  <div class="row">
    <label for="email" class="col-md-4">Email (Optional):</label>
    <input id="email" class="col-md-4" formControlName="email" type="email">
  </div>
  <div class="row">
    <div class="col-md-8"></div>
    <div class="col-md-4">
      <button class="btn btn-success" type="submit">Submit</button>
    </div>
  </div>
</form>
